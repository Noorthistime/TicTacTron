    /* ---------------------------------------------------- */
    /* 3. GAME STATE & LOGIC ENGINE                         */
    /* ---------------------------------------------------- */
    const GameState = (() => {
      // Configuration & Board state
      let board = Array(9).fill(null);
      let isXTurn = true; // X goes first
      let gameActive = true;
      let scoreX = 0;
      let scoreO = 0;
      let draws = 0;

      let isAIMode = false;
      let difficulty = 'hard'; // 'easy' or 'hard'

      const WINNING_COMBOS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
        [0, 4, 8], [2, 4, 6]             // Diagonals
      ];

      function toggleMode(toAI) {
        isAIMode = toAI;
        resetBoard();
      }

      function setDifficulty(diff) {
        difficulty = diff;
        resetBoard();
      }

      function resetScores() {
        scoreX = 0;
        scoreO = 0;
        draws = 0;
      }

      function checkWin(currentBoard) {
        for (let i = 0; i < WINNING_COMBOS.length; i++) {
          const [a, b, c] = WINNING_COMBOS[i];
          if (currentBoard[a] && currentBoard[a] === currentBoard[b] && currentBoard[a] === currentBoard[c]) {
            return { winner: currentBoard[a], line: WINNING_COMBOS[i] };
          }
        }
        if (currentBoard.every(cell => cell !== null)) {
          return { winner: 'draw', line: [] };
        }
        return null;
      }

      function makeMove(index, player) {
        if (board[index] === null && gameActive) {
          board[index] = player;
          return true;
        }
        return false;
      }

      function getBoard() { return board; }
      function isTurnX() { return isXTurn; }
      function toggleTurn() { isXTurn = !isXTurn; }
      function isGameActive() { return gameActive; }
      function setGameActive(active) { gameActive = active; }
      function getScores() { return { scoreX, scoreO, draws }; }
      function getAIMode() { return isAIMode; }
      function getDifficulty() { return difficulty; }

      function recordResult(result) {
        if (result === 'X') {
          scoreX++;
        } else if (result === 'O') {
          scoreO++;
        } else {
          draws++;
        }
      }

      function resetBoard() {
        board.fill(null);
        isXTurn = true;
        gameActive = true;
      }

      return {
        getBoard,
        isTurnX,
        toggleTurn,
        makeMove,
        checkWin,
        isGameActive,
        setGameActive,
        getScores,
        getAIMode,
        getDifficulty,
        toggleMode,
        setDifficulty,
        resetScores,
        recordResult,
        resetBoard
      };
    })();

    /* ---------------------------------------------------- */
    /* 4. SMART AI ENGINE (Minimax & Easy Logic)           */
    /* ---------------------------------------------------- */
    const AIEngine = (() => {
      // O is the AI and X is the human player in our defaults
      const AI = 'O';
      const HUMAN = 'X';

      // Easy AI: Makes a random empty cell selection
      function getEasyMove(board) {
        const empties = [];
        board.forEach((val, idx) => {
          if (val === null) empties.push(idx);
        });
        if (empties.length === 0) return null;
        return empties[Math.floor(Math.random() * empties.length)];
      }

      // Hard AI: Minimax optimal move selector
      function getHardMove(board) {
        let bestScore = -Infinity;
        let move = null;

        for (let i = 0; i < 9; i++) {
          if (board[i] === null) {
            board[i] = AI;
            let score = minimax(board, 0, false);
            board[i] = null;
            if (score > bestScore) {
              bestScore = score;
              move = i;
            }
          }
        }
        return move;
      }

      // Recursive minimax algorithm
      function minimax(currentBoard, depth, isMaximizing) {
        const result = GameState.checkWin(currentBoard);
        if (result) {
          if (result.winner === AI) return 10 - depth;
          if (result.winner === HUMAN) return depth - 10;
          if (result.winner === 'draw') return 0;
        }

        if (isMaximizing) {
          let bestScore = -Infinity;
          for (let i = 0; i < 9; i++) {
            if (currentBoard[i] === null) {
              currentBoard[i] = AI;
              let score = minimax(currentBoard, depth + 1, false);
              currentBoard[i] = null;
              bestScore = Math.max(score, bestScore);
            }
          }
          return bestScore;
        } else {
          let bestScore = Infinity;
          for (let i = 0; i < 9; i++) {
            if (currentBoard[i] === null) {
              currentBoard[i] = HUMAN;
              let score = minimax(currentBoard, depth + 1, true);
              currentBoard[i] = null;
              bestScore = Math.min(score, bestScore);
            }
          }
          return bestScore;
        }
      }

       // Recursive minimax algorithm with depth limit
       function minimaxLimited(currentBoard, depth, isMaximizing, maxDepth) {
         const result = GameState.checkWin(currentBoard);
         if (result) {
           if (result.winner === AI) return 10 - depth;
           if (result.winner === HUMAN) return depth - 10;
           if (result.winner === 'draw') return 0;
         }
         if (depth === maxDepth) {
           // simple heuristic: evaluate board
           return evaluateBoard(currentBoard);
         }

         if (isMaximizing) {
           let bestScore = -Infinity;
           for (let i = 0; i < 9; i++) {
             if (currentBoard[i] === null) {
               currentBoard[i] = AI;
               let score = minimaxLimited(currentBoard, depth + 1, false, maxDepth);
               currentBoard[i] = null;
               bestScore = Math.max(score, bestScore);
             }
           }
           return bestScore;
         } else {
           let bestScore = Infinity;
           for (let i = 0; i < 9; i++) {
             if (currentBoard[i] === null) {
               currentBoard[i] = HUMAN;
               let score = minimaxLimited(currentBoard, depth + 1, true, maxDepth);
               currentBoard[i] = null;
               bestScore = Math.min(score, bestScore);
             }
           }
           return bestScore;
         }
       }

       // Simple heuristic evaluation for medium AI
       function evaluateBoard(board) {
         // score based on lines
         let score = 0;
         const lines = [
           [0,1,2],[3,4,5],[6,7,8], // rows
           [0,3,6],[1,4,7],[2,5,8], // cols
           [0,4,8],[2,4,6]          // diagonals
         ];
         lines.forEach(line => {
           const [a,b,c] = line.map(i => board[i]);
           if (a === AI && b === AI && c === null) score += 5;
           if (a === AI && b === null && c === AI) score += 5;
           if (a === null && b === AI && c === AI) score += 5;
           if (a === HUMAN && b === HUMAN && c === null) score -= 5;
           if (a === HUMAN && b === null && c === HUMAN) score -= 5;
           if (a === null && b === HUMAN && c === HUMAN) score -= 5;
           // center bonus
           if (board[4] === AI) score += 2;
           if (board[4] === HUMAN) score -= 2;
         });
         return score;
       }

        function getMediumMove(board) {
          let bestScore = -Infinity;
          let move = null;

          for (let i = 0; i < 9; i++) {
            if (board[i] === null) {
              board[i] = AI;
              let score = minimaxLimited(board, 0, false, 2);
              board[i] = null;
              if (score > bestScore) {
                bestScore = score;
                move = i;
              }
            }
          }
          return move;
        }

       function getBestMove(board, diff) {
         if (diff === 'easy') {
           return getEasyMove(board);
         } else if (diff === 'medium') {
           return getMediumMove(board);
         } else {
           return getHardMove(board);
         }
       }

       return {
         getBestMove
       };
    })();

    /* ---------------------------------------------------- */
    /* 5. DOM CONTROLLER & VIEW INTERFACES                  */
    /* ---------------------------------------------------- */
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof StarfieldWarp !== 'undefined') StarfieldWarp.start();
      if (typeof IdkSpaceCursor !== 'undefined') IdkSpaceCursor.start();
      const boardCells = document.querySelectorAll('.cell');
      const scoreBoxX = document.getElementById('score-box-x');
      const scoreBoxO = document.getElementById('score-box-o');
      const valX = document.getElementById('val-x');
      const valO = document.getElementById('val-o');
      const valDraw = document.getElementById('val-draw');

      const labelX = document.getElementById('label-x');
      const labelO = document.getElementById('label-o');

      let customPlayerXName = 'Player X';
      let customPlayerOName = 'Player O';

      const modePvP = document.getElementById('mode-pvp');
      const modeAI = document.getElementById('mode-ai');
      const diffContainer = document.getElementById('difficulty-container');
      const diffEasy = document.getElementById('diff-easy');
      const diffMedium = document.getElementById('diff-medium');
      const diffHard = document.getElementById('diff-hard');

      const btnSound = document.getElementById('btn-sound');
      const svgSoundOn = document.getElementById('svg-sound-on');
      const svgSoundOff = document.getElementById('svg-sound-off');

      const btnResetBoard = document.getElementById('btn-reset-board');
      const btnResetScores = document.getElementById('btn-reset-scores');

      const overlay = document.getElementById('overlay');
      const modalBody = document.getElementById('modal-body');
      const btnPlayAgain = document.getElementById('btn-play-again');

      // Reconstructed Custom Dialog helper
      const CustomPrompt = (() => {
        const promptOverlay = document.getElementById('prompt-overlay');
        const promptTitle = document.getElementById('prompt-title');
        const promptInput = document.getElementById('prompt-input');
        const btnPromptOk = document.getElementById('btn-prompt-ok');
        const btnPromptCancel = document.getElementById('btn-prompt-cancel');

        let currentResolve = null;

        function show(titleText, defaultValue) {
          return new Promise((resolve) => {
            currentResolve = resolve;
            promptTitle.textContent = titleText;
            promptInput.value = defaultValue || '';
            promptOverlay.classList.add('active');
            setTimeout(() => {
              promptInput.focus();
              promptInput.select();
            }, 100);
          });
        }

        function hide() {
          promptOverlay.classList.remove('active');
          currentResolve = null;
        }

        function handleOk() {
          if (currentResolve) {
            currentResolve(promptInput.value);
          }
          hide();
        }

        function handleCancel() {
          if (currentResolve) {
            currentResolve(null);
          }
          hide();
        }

        // Event listeners
        btnPromptOk.addEventListener('click', () => {
          SoundSynth.playClick();
          handleOk();
        });

        btnPromptCancel.addEventListener('click', () => {
          SoundSynth.playClick();
          handleCancel();
        });

        promptInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            SoundSynth.playClick();
            handleOk();
          } else if (e.key === 'Escape') {
            SoundSynth.playClick();
            handleCancel();
          }
        });

        // Close when clicking overlay backdrop
        promptOverlay.addEventListener('click', (e) => {
          if (e.target === promptOverlay) {
            SoundSynth.playClick();
            handleCancel();
          }
        });

        return { show };
      })();

      // SVG code templates
      const svgX = `
        <div class="marker" aria-label="X">
          <svg viewBox="0 0 100 100">
            <line class="x-line" x1="15" y1="15" x2="85" y2="85" />
            <line class="x-line x-line-2" x1="85" y1="15" x2="15" y2="85" />
          </svg>
        </div>`;

      const svgO = `
        <div class="marker" aria-label="O">
          <svg viewBox="0 0 100 100">
            <circle class="o-circle" cx="50" cy="50" r="40" />
          </svg>
        </div>`;

      // Main Cell click handler
      function handleCellClick(index) {
        if (!GameState.isGameActive() || GameState.getBoard()[index] !== null) return;

        const currentPlayer = GameState.isTurnX() ? 'X' : 'O';

        // Execute move
        GameState.makeMove(index, currentPlayer);
        renderCell(index, currentPlayer);
        SoundSynth.playPlaceSound(GameState.isTurnX());

        // Check for results
        const outcome = GameState.checkWin(GameState.getBoard());
        if (outcome) {
          handleGameEnd(outcome);
          return;
        }

        // Swap Turn
        GameState.toggleTurn();
        updateTurnIndicators();
        updatePreviewStyles();

        // If AI Mode is on and it is AI turn
        if (GameState.getAIMode() && !GameState.isTurnX()) {
          disableBoardClicks();
          setTimeout(() => {
            const bestMoveIndex = AIEngine.getBestMove(GameState.getBoard(), GameState.getDifficulty());
            if (bestMoveIndex !== null && GameState.isGameActive()) {
              GameState.makeMove(bestMoveIndex, 'O');
              renderCell(bestMoveIndex, 'O');
              SoundSynth.playPlaceSound(false);

              const aiOutcome = GameState.checkWin(GameState.getBoard());
              if (aiOutcome) {
                handleGameEnd(aiOutcome);
              } else {
                GameState.toggleTurn();
                updateTurnIndicators();
                updatePreviewStyles();
                enableBoardClicks();
              }
            }
          }, 600); // realistic think duration delay
        }
      }

      function renderCell(index, symbol) {
        const cell = boardCells[index];
        cell.classList.add('filled');
        cell.innerHTML = (symbol === 'X') ? svgX : svgO;
        cell.setAttribute('aria-label', `Cell ${index + 1}, marked with ${symbol}`);
      }

      function handleGameEnd(outcome) {
        GameState.setGameActive(false);
        disableBoardClicks();

        if (outcome.winner === 'draw') {
          GameState.recordResult('draw');
          SoundSynth.playDraw();
          modalBody.innerHTML = `It's a <span class="draw-text">Draw</span>!`;
          updateScoreDisplay();
          setTimeout(() => {
            showModal();
          }, 800);
        } else {
          GameState.recordResult(outcome.winner);
          SoundSynth.playWin();

          // Highlight winning cells
          outcome.line.forEach(idx => {
            boardCells[idx].classList.add('winner-cell', outcome.winner === 'X' ? 'winner-x' : 'winner-o');
            boardCells[idx].style.color = outcome.winner === 'X' ? 'var(--color-cyan)' : 'var(--color-magenta)';
          });

          const winnerLabel = outcome.winner === 'X' ? customPlayerXName : (GameState.getAIMode() ? 'Smart AI' : customPlayerOName);
          const spanClass = outcome.winner === 'X' ? 'winner-text-x' : 'winner-text-o';
          modalBody.innerHTML = `<span class="${spanClass}">${winnerLabel}</span> Wins!`;

          updateScoreDisplay();

          // Trigger Confetti
          Confetti.start();

          setTimeout(() => {
            showModal();
          }, 1400);
        }
      }

      function showModal() {
        overlay.classList.add('active');
        btnPlayAgain.focus();
      }

      function hideModal() {
        overlay.classList.remove('active');
      }

      function updateScoreDisplay() {
        const scores = GameState.getScores();
        valX.textContent = scores.scoreX;
        valO.textContent = scores.scoreO;
        valDraw.textContent = scores.draws;

        scoreBoxX.classList.remove('winning-x');
        scoreBoxO.classList.remove('winning-o');

        if (scores.scoreX > scores.scoreO) {
          scoreBoxX.classList.add('winning-x');
        } else if (scores.scoreO > scores.scoreX) {
          scoreBoxO.classList.add('winning-o');
        }
      }

      function updateTurnIndicators() {
        if (GameState.isTurnX()) {
          scoreBoxX.classList.add('active-x');
          scoreBoxO.classList.remove('active-o');
        } else {
          scoreBoxX.classList.remove('active-x');
          scoreBoxO.classList.add('active-o');
        }
      }

      function updatePreviewStyles() {
        const currentSymbolClass = GameState.isTurnX() ? 'preview-x' : 'preview-o';
        const otherSymbolClass = GameState.isTurnX() ? 'preview-o' : 'preview-x';

        boardCells.forEach(cell => {
          if (!cell.classList.contains('filled')) {
            cell.classList.remove(otherSymbolClass);
            cell.classList.add(currentSymbolClass);
          } else {
            cell.classList.remove('preview-x', 'preview-o');
          }
        });
      }

      function disableBoardClicks() {
        boardCells.forEach(c => c.style.pointerEvents = 'none');
      }

      function enableBoardClicks() {
        boardCells.forEach(c => c.style.pointerEvents = 'auto');
      }

      function resetUIPresentation() {
        boardCells.forEach((cell, index) => {
          cell.className = 'cell';
          cell.innerHTML = '';
          cell.style.color = '';
          cell.style.boxShadow = '';
          cell.setAttribute('aria-label', `Cell ${index + 1}, empty`);
        });
        updateTurnIndicators();
        updatePreviewStyles();
        enableBoardClicks();
        Confetti.stop();
      }

      function handleModeToggle(toAI) {
        GameState.toggleMode(toAI);
        labelO.textContent = toAI ? 'Smart AI' : customPlayerOName;
        labelX.textContent = customPlayerXName;

        if (toAI) {
          diffContainer.classList.add('visible');
          modeAI.classList.add('active');
          modeAI.setAttribute('aria-checked', 'true');
          modePvP.classList.remove('active');
          modePvP.setAttribute('aria-checked', 'false');
        } else {
          diffContainer.classList.remove('visible');
          modePvP.classList.add('active');
          modePvP.setAttribute('aria-checked', 'true');
          modeAI.classList.remove('active');
          modeAI.setAttribute('aria-checked', 'false');
        }

        resetUIPresentation();
      }

      function handleDifficultyToggle(diff) {
        GameState.setDifficulty(diff);
        
        const mobileDiffSelect = document.getElementById('mobile-diff-select');
        if (mobileDiffSelect) {
          mobileDiffSelect.value = diff;
        }
        
        diffEasy.classList.remove('active');
        diffEasy.setAttribute('aria-checked', 'false');
        diffEasy.tabIndex = -1;
        
        diffMedium.classList.remove('active');
        diffMedium.setAttribute('aria-checked', 'false');
        diffMedium.tabIndex = -1;
        
        diffHard.classList.remove('active');
        diffHard.setAttribute('aria-checked', 'false');
        diffHard.tabIndex = -1;

        if (diff === 'easy') {
          diffEasy.classList.add('active');
          diffEasy.setAttribute('aria-checked', 'true');
          diffEasy.tabIndex = 0;
        } else if (diff === 'medium') {
          diffMedium.classList.add('active');
          diffMedium.setAttribute('aria-checked', 'true');
          diffMedium.tabIndex = 0;
        } else {
          diffHard.classList.add('active');
          diffHard.setAttribute('aria-checked', 'true');
          diffHard.tabIndex = 0;
        }
        resetUIPresentation();
      }

      // Theme toggle bindings
      const btnThemeToggle = document.getElementById('btn-theme-toggle');
      if (btnThemeToggle) {
        btnThemeToggle.addEventListener('click', () => {
          SoundSynth.playClick();
          Theme.toggleTheme();
        });
      }

      // Cyclic Theme toggle binding
      const btnThemeCycle = document.getElementById('btn-theme-cycle');
      if (btnThemeCycle) {
        btnThemeCycle.addEventListener('click', () => {
          SoundSynth.playClick();
          PremiumThemes.cycleTheme();
        });
      }

      // Event Bindings
      boardCells.forEach((cell, idx) => {
        cell.addEventListener('click', () => {
          handleCellClick(idx);
        });

        // Keyboard navigation accessibility
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleCellClick(idx);
          }
        });
      });

      // Player name customization bindings
      scoreBoxX.addEventListener('click', () => {
        if (!GameState.getAIMode()) {
          SoundSynth.playClick();
          CustomPrompt.show("Enter name for Player X:", customPlayerXName).then((newName) => {
            if (newName !== null && newName.trim() !== "") {
              customPlayerXName = newName.trim();
              labelX.textContent = customPlayerXName;
            }
          });
        }
      });

      scoreBoxO.addEventListener('click', () => {
        if (!GameState.getAIMode()) {
          SoundSynth.playClick();
          CustomPrompt.show("Enter name for Player O:", customPlayerOName).then((newName) => {
            if (newName !== null && newName.trim() !== "") {
              customPlayerOName = newName.trim();
              labelO.textContent = customPlayerOName;
            }
          });
        }
      });

      modePvP.addEventListener('click', () => {
        SoundSynth.playClick();
        handleModeToggle(false);
      });

      modeAI.addEventListener('click', () => {
        SoundSynth.playClick();
        handleModeToggle(true);
      });

      diffEasy.addEventListener('click', () => {
        SoundSynth.playClick();
        handleDifficultyToggle('easy');
      });

      diffMedium.addEventListener('click', () => {
        SoundSynth.playClick();
        handleDifficultyToggle('medium');
      });

      diffHard.addEventListener('click', () => {
        SoundSynth.playClick();
        handleDifficultyToggle('hard');
      });

      const mobileDiffSelect = document.getElementById('mobile-diff-select');
      if (mobileDiffSelect) {
        mobileDiffSelect.addEventListener('change', (e) => {
          SoundSynth.playClick();
          handleDifficultyToggle(e.target.value);
        });
      }

      btnSound.addEventListener('click', () => {
        const isMuted = SoundSynth.toggleMute();
        if (isMuted) {
          svgSoundOn.style.display = 'none';
          svgSoundOff.style.display = 'block';
        } else {
          svgSoundOn.style.display = 'block';
          svgSoundOff.style.display = 'none';
          SoundSynth.playClick();
        }
      });

      btnResetBoard.addEventListener('click', () => {
        SoundSynth.playClick();
        GameState.resetBoard();
        resetUIPresentation();
      });

      btnResetScores.addEventListener('click', () => {
        SoundSynth.playClick();
        GameState.resetScores();
        updateScoreDisplay();
        GameState.resetBoard();
        resetUIPresentation();
      });

      btnPlayAgain.addEventListener('click', () => {
        SoundSynth.playClick();
        hideModal();
        GameState.resetBoard();
        resetUIPresentation();
      });

      // Close modal on background click
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          hideModal();
          GameState.resetBoard();
          resetUIPresentation();
        }
      });

      // Keyboard support for settings
      const btnToggles = document.querySelectorAll('.btn-toggle');
      btnToggles.forEach(btn => {
        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            btn.click();
          }
        });
      });

      // Initial setup
      resetUIPresentation();
      updateScoreDisplay();

      // Logo interactive hover animation alternating
      const logoLink = document.querySelector('.logo-container');
      const logoSvg = document.querySelector('.header-logo');
      if (logoLink && logoSvg) {
        let hoverCount = 0;
        logoLink.addEventListener('mouseenter', () => {
          if (hoverCount % 2 === 0) {
            logoSvg.classList.add('animate-o');
            logoSvg.classList.remove('animate-x');
          } else {
            logoSvg.classList.add('animate-x');
            logoSvg.classList.remove('animate-o');
          }
          hoverCount++;
        });

        logoLink.addEventListener('mouseleave', () => {
          logoSvg.classList.remove('animate-o', 'animate-x');
        });
      }
    });
  </script>
</body>
